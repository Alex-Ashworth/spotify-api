[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist_sorter"
version = "0.1.0"
description = "Spotify API based Python project to sort playlists."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
compose_linter = "compose_linter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
